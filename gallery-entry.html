<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Вход в галерею — nikonovphoto</title>
		<meta name="description" content="Вход в галерею nikonovphoto: цитата Эллиотта Эрвитта проявляется снимком." />
		<meta name="author" content="nikonovphoto" />
		<meta name="theme-color" content="#0b0f15" />
		<link rel="shortcut icon" href="favicon.ico">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
		<!-- ?v=… — версия файлов: после изменений CSS/JS увеличьте число, и браузеры не покажут старую копию из кэша -->
		<link rel="stylesheet" href="css/hero.css?v=2" />
		<link rel="stylesheet" href="css/parallax.css?v=54" />
		<link rel="stylesheet" href="css/art.css?v=2" />
		<link rel="stylesheet" href="css/gallery-entry.css?v=19" />
	</head>
	<body class="ge-page">
		<!-- плёночное зерно (css/art.css) -->
		<div class="grain" aria-hidden="true"></div>

		<!-- Шапка — общая для всех страниц; логотип ведёт на главную -->
		<div class="topbar is-logo">
			<div class="topbar__brand">
				<button class="topbar__burger" type="button" aria-label="Открыть меню">
					<span class="topbar__burger-icon" aria-hidden="true"></span>
				</button>
				<a class="topbar__logo" href="index.html" aria-label="nikonovphoto — на главную">
					<img src="img/hero/logo.png" alt="" width="628" height="353">
				</a>
			</div>
			<a class="topbar__contact" href="https://t.me/nikonovphoto" target="_blank" rel="noopener">связаться со&nbsp;мной</a>
		</div>
		<div class="topbar-scrim" aria-hidden="true"></div>

		<!-- Вход в галерею. Экран закреплён, пока идёт прокрутка блока.
		     Страница с цитатой нарисована в текстуру и спроецирована из неподвижной камеры на объёмную сцену на весь экран
		     (плёнка с кадрами галереи, диафрагма, объектив, полароиды): из исходной точки всё выглядит плоской страницей,
		     при прокрутке камера облетает сцену — проявляются объём, цвет, свет и снимки. Код — js/gallery-entry.js -->
		<main class="ge" aria-labelledby="ge-title">
			<div class="ge__pin">
				<div class="ge__stage" aria-hidden="true"></div>

				<!-- тот же текст для поиска и экранного диктора: на экране он нарисован в WebGL -->
				<figure class="sr-only">
					<h1 id="ge-title">Добро пожаловать!</h1>
					<blockquote>
						<p>«Для меня фотография — это искусство наблюдения. Это умение найти что-то интересное в самом обыкновенном месте…»</p>
					</blockquote>
					<figcaption>Эллиотт Эрвитт</figcaption>
				</figure>

				<!-- приглашение: по кругу вращается надпись, внутри «дышит» диафрагма — с первым движением колеса
				     она раскрывается настежь и сцена уходит в облёт. Клик делает то же самое. Лепестки открывает js/gallery-entry.js -->
				<button class="ge__invite" type="button" aria-label="Приглашаю в галерею — чтобы войти, листай">
					<span class="ge__invite-title" aria-hidden="true">Приглашаю в&nbsp;галерею</span>
					<svg class="ge__invite-svg" viewBox="0 0 200 200" aria-hidden="true">
						<defs>
							<path id="ge-orbit" d="M100,100 m-82,0 a82,82 0 1,1 164,0 a82,82 0 1,1 -164,0"/>
							<clipPath id="ge-lens"><circle cx="100" cy="100" r="46"/></clipPath>
						</defs>
						<g class="ge__invite-ring">
							<text><textPath href="#ge-orbit" textLength="512" lengthAdjust="spacing">чтобы войти — листай · чтобы войти — листай ·</textPath></text>
						</g>
						<circle class="ge__invite-rim" cx="100" cy="100" r="50"/>
						<g clip-path="url(#ge-lens)">
							<circle cx="100" cy="100" r="46" fill="#0b0f15"/>
							<g class="ge__blades">
								<g transform="rotate(0 100 100)"><path class="ge__blade" d="M100 100 L100 40 L151.96 70 Z"/></g>
								<g transform="rotate(60 100 100)"><path class="ge__blade ge__blade--b" d="M100 100 L100 40 L151.96 70 Z"/></g>
								<g transform="rotate(120 100 100)"><path class="ge__blade" d="M100 100 L100 40 L151.96 70 Z"/></g>
								<g transform="rotate(180 100 100)"><path class="ge__blade ge__blade--b" d="M100 100 L100 40 L151.96 70 Z"/></g>
								<g transform="rotate(240 100 100)"><path class="ge__blade" d="M100 100 L100 40 L151.96 70 Z"/></g>
								<g transform="rotate(300 100 100)"><path class="ge__blade ge__blade--b" d="M100 100 L100 40 L151.96 70 Z"/></g>
							</g>
						</g>
					</svg>
				</button>
			</div>
		</main>

		<!-- после входа — зал галереи (на главной это блок с комнатой) -->
		<section class="ge-next" aria-label="Зал галереи">
			<p class="ge-next__text t-h2">Здесь начинается зал галереи</p>
			<a class="topbar__contact" href="index.html#room">открыть на&nbsp;главной</a>
		</section>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
		<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
				}
			}
		</script>
		<script type="module" src="js/gallery-entry.js?v=30"></script>
	</body>
</html>
