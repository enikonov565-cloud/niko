<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Мои работы — nikonovphoto</title>
		<meta name="description" content="Работы nikonovphoto по разделам: портрет, уличный портрет, стрит-фото, архитектура и пейзаж." />
		<meta name="author" content="nikonovphoto" />
		<meta name="theme-color" content="#0e3855" />
		<link rel="shortcut icon" href="favicon.ico">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
		<!-- ?v=… — версия файлов: после изменений CSS/JS увеличьте число, и браузеры не покажут старую копию из кэша -->
		<link rel="stylesheet" href="css/hero.css?v=2" />
		<link rel="stylesheet" href="css/art.css?v=2" />
		<link rel="stylesheet" href="css/works.css?v=50" />
		<link rel="stylesheet" href="css/photo-card.css?v=5" />
	</head>
	<body class="works-page">
		<!-- плёночное зерно (css/art.css) -->
		<div class="grain" aria-hidden="true"></div>

		<!-- Шапка — общая для всех страниц; логотип ведёт на главную -->
		<div class="topbar is-logo">
			<div class="topbar__brand">
				<button class="topbar__burger" type="button" aria-label="Открыть меню">
					<span class="topbar__burger-icon" aria-hidden="true"></span>
				</button>
				<a class="topbar__logo" href="index.html" aria-label="nikonovphoto — на главную">
					<img src="img/hero/logo.png" alt="" width="628" height="353">
				</a>
			</div>
			<a class="topbar__contact" href="https://t.me/nikonovphoto" target="_blank" rel="noopener">связаться со&nbsp;мной</a>
		</div>
		<div class="topbar-scrim" aria-hidden="true"></div>

		<main>
			<!-- «Мои работы»: пять разделов ступеньками, под снимком — только название раздела.
			     Карточка открывает просмотр снимков раздела, кнопка — всех снимков. Строит js/works.js из js/gallery-photos.js и js/services-data.js -->
			<section class="wk" aria-labelledby="wk-title">
				<header class="wk__head">
					<h1 class="wk__title" id="wk-title">Выбор за&nbsp;вами</h1>
<p class="wk__lead t-h3"><span>Пять разделов&nbsp;— выберите, с&nbsp;чего начать,</span> <span>или&nbsp;смотрите всё подряд.</span></p>
				</header>

				<ol class="wk__stairs" aria-label="Разделы"></ol>

				<!-- все снимки — блок «Мои работы» на главной -->
				<a class="wk-btn wk__all" href="index.html#all-works"><span class="wk-btn__label">все работы</span></a>
			</section>

		</main>

		<!-- просмотр раздела: сетка снимков ↔ один кадр на весь экран (по мотивам codrops GridViewSwitch, MIT); строит js/works.js -->
		<div class="wv" aria-hidden="true" aria-label="Просмотр снимков"></div>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js"></script>
		<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
		<script src="js/gallery-photos.js?v=56"></script>
		<script src="js/services-data.js?v=3"></script>
		<script src="js/works.js?v=28"></script>
		<script src="js/photo-card.js?v=7"></script>
	</body>
</html>
