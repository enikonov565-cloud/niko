<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Мой подход — nikonovphoto</title>
		<meta name="description" content="Как снимает nikonovphoto: взгляд, свет, настоящие эмоции и только кадры со смыслом." />
		<meta name="author" content="nikonovphoto" />
		<meta name="theme-color" content="#0b0f15" />
		<link rel="shortcut icon" href="favicon.ico">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
		<!-- ?v=… — версия файлов: после изменений CSS/JS увеличьте число, и браузеры не покажут старую копию из кэша -->
		<link rel="stylesheet" href="css/hero.css?v=2" />
		<link rel="stylesheet" href="css/art.css?v=2" />
		<link rel="stylesheet" href="css/approach.css?v=27" />
	</head>
	<body class="approach-page">
		<!-- плёночное зерно (css/art.css) -->
		<div class="grain" aria-hidden="true"></div>

		<!-- Шапка — общая для всех страниц; логотип ведёт на главную -->
		<div class="topbar is-logo">
			<div class="topbar__brand">
				<button class="topbar__burger" type="button" aria-label="Открыть меню">
					<span class="topbar__burger-icon" aria-hidden="true"></span>
				</button>
				<a class="topbar__logo" href="index.html" aria-label="nikonovphoto — на главную">
					<img src="img/hero/logo.png" alt="" width="628" height="353">
				</a>
			</div>
			<a class="topbar__contact" href="https://t.me/nikonovphoto" target="_blank" rel="noopener">связаться со&nbsp;мной</a>
		</div>
		<div class="topbar-scrim" aria-hidden="true"></div>

		<!-- Слайдер: фон на весь экран (WebGL), два снимка в рамках внахлёст и фраза крупно.
		     Слайды строит js/approach.js из списка js/approach-data.js -->
		<main class="sl" aria-roledescription="слайдер">
			<div class="sl__pin">
				<div class="sl__bg" aria-hidden="true"></div>

				<!-- заголовок и цитата — общие для всех слайдов -->
				<header class="sl__head">
					<h1 class="sl__title">Мой подход</h1>
					<figure class="sl__quote">
						<blockquote class="sl__quote-text">
							<p><span>«Которая из&nbsp;моих фотографий самая любимая?</span> <span>Та, которую я&nbsp;собираюсь снять завтра».</span></p>
						</blockquote>
						<figcaption class="sl__quote-author">Имоджен Каннингем</figcaption>
					</figure>
				</header>

				<div class="sl__slides"></div>

				<nav class="sl__bullets" aria-label="Слайды"></nav>
				<!-- «мои работы» — кнопка в галерею на главной (css/approach.css) -->
				<a class="sl__works" href="index.html#gallery-entry"><span class="sl__works-label">мои работы</span></a>
				<div class="sl__hint" aria-hidden="true">
					<svg viewBox="0 0 22 52"><path d="M11 1v49M2 41l9 9 9-9"/></svg>
				</div>
				<p class="sr-only" aria-live="polite" data-sl="status"></p>
			</div>
		</main>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
		<script src="js/approach-data.js?v=14"></script>
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
				}
			}
		</script>
		<script type="module" src="js/approach.js?v=17"></script>
	</body>
</html>
